[package]
name = "betonme"
version = "0.1.0"
description = "BetOnMe — Daily lock tracker"
authors = ["kaneki"]
edition = "2021"

[lib]
name = "betonme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "betonme"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
