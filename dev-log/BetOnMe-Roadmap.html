  ╔══════════════════════════════════════════════════════════════════╗
  ║         CONCEPT GEOLOGICAL STACK — TEMPLATE v2                  ║
  ║                                                                  ║
  ║  NEW IN v2:                                                      ║
  ║  • prereqs[]        — highlight dependency layers on hover      ║
  ║  • misconceptions[] — second chip set with "trap" styling       ║
  ║  • difficulty: 1–5  — shown as dots on stratum face             ║
  ║  • connects[]       — cross-layer chip links                    ║
  ║  • selfTest mode    — hide chip info until revealed             ║
  ║  • mech.why / mech.how split — motivation vs mechanism          ║
  ║                                                                  ║
  ║  HOW TO USE:                                                     ║
  ║  1. Set CONCEPT_META at the top                                  ║
  ║  2. Fill in LAYERS[] — one object per level                     ║
  ║  3. Fill in VARIANTS[]                                          ║
  ║  4. Fill in TRACES[]                                            ║
  ║  5. Update UI labels (search "TEMPLATE_LABEL")                  ║
  ╚══════════════════════════════════════════════════════════════════╝

  LAYER OBJECT SHAPE (v2):
  {
    key:      'unique_id',
    label:    'Display Name',
    badge:    'Short Tag',
    lc:       '#hexcolor',
    badgeBg:  'rgba(...)',
    badgeFg:  'rgba(...)',
    difficulty: 3,                  // NEW: 1–5 dots shown on stratum
    prereqs:  ['key1', 'key2'],     // NEW: keys of layers that must be understood first
    rank:     { icon: '♔', label: 'King' },
    examples: ['tag1','tag2'],
    eyebrow:  'Layer N — Role',
    title:    'Full title',
    ac:       '#hexcolor',
    acBg:     '#hexcolor',
    mech: {
      why:   'One sentence — why does this layer exist at all?',   // NEW

      ]
    },
    chips: [
      { n: 'Component', i: 'Explanation.',
        connects: { layer: 'target_key', chip: 'Target Chip Name' }  // NEW (optional)
      }
    ],
    misconceptions: [               // NEW: traps / gotchas chip set
      { n: 'Trap name', i: 'Why this is wrong / what people get confused about.' }
    ],
    sowhat:  '<strong>Bold point.</strong> Supporting sentence.',
    trace:   [0, 1, 2]
  }
-->

<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&family=Archivo:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f2ede4;--black:#111;--white:#fff;
  --gold:#c8920a;--gold-light:rgba(200,146,10,0.1);--gold-border:rgba(200,146,10,0.45);
  --danger:#c0392b;--danger-light:rgba(192,57,43,0.08);--danger-border:rgba(192,57,43,0.35);
}
body{background:var(--color-background-tertiary,#f2ede4);font-family:'Archivo',sans-serif}
.wrap{display:grid;grid-template-columns:1fr 300px;min-height:600px;max-width:920px;margin:0 auto;border:2px solid var(--black)}

/* LEFT */
.strata-col{
  background:var(--color-background-secondary,#fafaf6);
  border-right:2px solid var(--black);
  display:flex;flex-direction:column;
  padding:1.2rem 1.4rem 0.8rem 1.4rem;
  position:relative;
}
.strata-label{
  font-family:'JetBrains Mono',monospace;font-size:0.52rem;
  letter-spacing:0.16em;text-transform:uppercase;
  color:var(--color-text-secondary,#888);margin-bottom:0.9rem;
}
.perspective-wrap{
  perspective:900px;perspective-origin:50% -20%;
  flex:1;display:flex;flex-direction:column;justify-content:center;
  position:relative;
}
.stack-3d{
  transform:rotateX(8deg);transform-style:preserve-3d;
  display:flex;flex-direction:column;gap:0;
  margin-left:2rem;
}

/* LEFT GUTTER */
.left-gutter{
  position:absolute;left:1.4rem;top:0;bottom:0;
  width:1.5rem;display:flex;flex-direction:column;align-items:center;
  pointer-events:none;
}
.gutter-crown{font-size:1rem;line-height:1;padding-top:4px;color:var(--gold);flex-shrink:0;}
.gutter-line-top{width:2px;background:linear-gradient(180deg,var(--gold-border),rgba(200,146,10,0.1));flex-shrink:0;}
.gutter-distro-bar{
  width:4px;border-radius:2px;
  background:linear-gradient(180deg,var(--gold),rgba(200,146,10,0.35));
  position:relative;flex-shrink:0;
}
.gutter-distro-label{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  font-family:'JetBrains Mono',monospace;font-size:0.37rem;
  text-transform:uppercase;letter-spacing:0.15em;color:var(--gold);
  writing-mode:vertical-rl;white-space:nowrap;
}
.gutter-line-bot{width:2px;flex:1;background:linear-gradient(180deg,rgba(200,146,10,0.15),transparent);}

/* STRATA */
.stratum{position:relative;cursor:pointer;transition:filter 0.18s,transform 0.18s;}
.stratum:hover{filter:brightness(1.06);transform:scaleX(1.02);}
.stratum.active{transform:scaleX(1.04);filter:brightness(1.1);}
.stratum.prereq-lit .stratum-face{outline:2px solid var(--gold) !important;outline-offset:-2px;}
.stratum.variant-layer .stratum-face{border-left:3px solid rgba(200,146,10,0.6) !important;}
.stratum-face{
  height:62px;display:flex;align-items:center;
  padding:0 0.9rem 0 0.9rem;position:relative;overflow:hidden;
  border-left:3px solid transparent;
}
.stratum-face::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(93deg,transparent 0px,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
  pointer-events:none;
}
.stratum-edge{height:7px;opacity:0.45;background:rgba(0,0,0,0.22);clip-path:polygon(0 0,100% 0,99% 100%,1% 100%);}
@keyframes pulse-sweep{0%{top:-4px;opacity:0}20%{opacity:0.7}80%{opacity:0.4}100%{top:calc(100% + 4px);opacity:0}}
.pulse-line{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,0.8);animation:pulse-sweep 0.6s ease-in forwards;pointer-events:none;top:-4px;}
.st-num{font-family:'JetBrains Mono',monospace;font-size:0.5rem;font-weight:700;color:rgba(255,255,255,0.4);letter-spacing:0.1em;flex-shrink:0;margin-right:0.6rem;}
.st-text{flex:1;min-width:0;}
.st-name{font-family:'Archivo Black',sans-serif;font-size:0.78rem;color:#fff;line-height:1.1;}
.st-examples{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;}
.st-ex-tag{font-family:'JetBrains Mono',monospace;font-size:0.4rem;padding:1px 5px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.65);border-radius:2px;white-space:nowrap;}
.st-badge{font-family:'JetBrains Mono',monospace;font-size:0.48rem;font-weight:700;padding:2px 6px;border-radius:2px;flex-shrink:0;text-transform:uppercase;letter-spacing:0.06em;margin-left:0.5rem;opacity:0.85;}
.st-rank{margin-left:0.4rem;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:1px;}
.st-rank-icon{font-size:0.9rem;line-height:1;}
.st-rank-label{font-family:'JetBrains Mono',monospace;font-size:0.36rem;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.07em;white-space:nowrap;}

/* NEW: difficulty dots on stratum */
.st-difficulty{display:flex;flex-direction:column;align-items:center;gap:2px;margin-left:0.4rem;flex-shrink:0;}
.st-diff-dots{display:flex;gap:2px;}
.st-diff-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.18);}
.st-diff-dot.on{background:rgba(255,255,255,0.75);}
.st-diff-label{font-family:'JetBrains Mono',monospace;font-size:0.3rem;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;}

.depth-gap{height:4px;background:linear-gradient(180deg,rgba(0,0,0,0.18) 0,rgba(0,0,0,0.04) 100%);}

/* FOOTER */
.stack-footer{display:flex;flex-direction:column;gap:0.5rem;margin-top:0.8rem;}
.strata-nav{display:flex;align-items:center;gap:0.5rem;}
.nav-btn{font-family:'JetBrains Mono',monospace;font-size:0.6rem;padding:4px 12px;border:2px solid var(--black);background:var(--white);cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;transition:background 0.12s,color 0.12s;}
.nav-btn:hover{background:var(--black);color:var(--white);}
.nav-btn:disabled{opacity:0.25;pointer-events:none;}
.nav-dots{display:flex;gap:4px;margin:0 auto;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--color-border-secondary,#ccc);cursor:pointer;transition:background 0.15s,transform 0.15s;}
.nav-dot.on{background:var(--black);transform:scale(1.3);}
.nav-ctr{font-family:'JetBrains Mono',monospace;font-size:0.56rem;color:var(--color-text-secondary,#999);}

.variant-key-row{
  display:flex;align-items:center;gap:0.55rem;
  padding:0.38rem 0.6rem;
  border:1.5px solid var(--gold-border);
  background:var(--gold-light);
}
.variant-key-bar{width:4px;height:22px;background:linear-gradient(180deg,var(--gold),rgba(200,146,10,0.35));border-radius:2px;flex-shrink:0;}
.variant-key-text{font-family:'JetBrains Mono',monospace;font-size:0.48rem;color:var(--color-text-secondary,#666);line-height:1.55;flex:1;}
.variant-key-text strong{font-family:'Archivo Black',sans-serif;font-size:0.52rem;color:var(--gold);display:block;}
.variant-toggle-btn{
  font-family:'JetBrains Mono',monospace;font-size:0.5rem;
  padding:4px 10px;border:1.5px solid var(--gold-border);
  background:var(--white);color:var(--gold);
  cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;
  transition:all 0.14s;white-space:nowrap;flex-shrink:0;
}
.variant-toggle-btn:hover,.variant-toggle-btn.on{background:var(--gold);color:#fff;border-color:var(--gold);}

/* RIGHT */
.detail-col{background:var(--color-background-primary,#fff);display:flex;flex-direction:column;overflow:hidden;}
.layer-panel{display:flex;flex-direction:column;height:100%;}
.detail-header{padding:0.8rem 1.2rem 0.7rem;border-bottom:2px solid var(--black);transition:background 0.3s;flex-shrink:0;}
.d-eyebrow{font-family:'JetBrains Mono',monospace;font-size:0.53rem;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.7);margin-bottom:0.2rem;}
.d-title{font-family:'Archivo Black',sans-serif;font-size:1rem;color:#fff;line-height:1.1;}

/* NEW: difficulty bar in header */
.d-meta-row{display:flex;align-items:center;gap:0.6rem;margin-top:0.35rem;}
.d-diff-row{display:flex;align-items:center;gap:4px;}
.d-diff-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.2);}
.d-diff-dot.on{background:rgba(255,255,255,0.9);}
.d-diff-label{font-family:'JetBrains Mono',monospace;font-size:0.42rem;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:0.1em;}
.d-prereq-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.d-prereq-label{font-family:'JetBrains Mono',monospace;font-size:0.42rem;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em;white-space:nowrap;}
.d-prereq-tag{font-family:'JetBrains Mono',monospace;font-size:0.4rem;padding:1px 6px;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.8);border-radius:2px;cursor:pointer;transition:background 0.12s;}
.d-prereq-tag:hover{background:rgba(255,255,255,0.3);}

.detail-body{flex:1;padding:0.85rem 1.2rem;overflow-y:auto;}
.detail-body-inner{opacity:1;transform:translateY(0);transition:opacity 0.16s,transform 0.16s;}
.detail-body-inner.out{opacity:0;transform:translateY(8px);}
.detail-body-inner.in{animation:din 0.2s ease forwards;}
@keyframes din{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* NEW: mech why strip */
.mech-why{
  font-family:'Archivo',sans-serif;font-size:0.68rem;
  color:var(--color-text-secondary,#555);line-height:1.45;
  border-left:3px solid var(--ac,#333);padding-left:0.6rem;
  margin-bottom:0.65rem;font-style:italic;
  transition:border-color 0.3s;
}
.mech-why strong{font-family:'Archivo Black',sans-serif;font-style:normal;color:var(--ac,#333);font-size:0.6rem;display:block;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px;transition:color 0.3s;}

.mech-block{margin-bottom:0.9rem;}
.mech-title{font-family:'JetBrains Mono',monospace;font-size:0.51rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--color-text-secondary,#999);margin-bottom:0.4rem;}
.mech-rows{display:flex;flex-direction:column;gap:3px;}
.mech-row{display:flex;align-items:center;gap:7px;}
.mech-box{font-family:'JetBrains Mono',monospace;font-size:0.6rem;font-weight:700;padding:5px 8px;border:1.5px solid currentColor;min-width:76px;text-align:center;letter-spacing:0.03em;flex-shrink:0;}
.mech-arrow{font-size:0.65rem;flex-shrink:0;opacity:0.5;}
.mech-caption{font-family:'Archivo',sans-serif;font-size:0.66rem;color:var(--color-text-secondary,#555);line-height:1.4;flex:1;}

/* chips — components */
.chips-section-label{
  font-family:'JetBrains Mono',monospace;font-size:0.51rem;letter-spacing:0.13em;
  text-transform:uppercase;color:var(--color-text-secondary,#999);
  margin:0.7rem 0 0.35rem;display:flex;align-items:center;gap:0.5rem;
}
.chips-section-label .self-test-btn{
  font-family:'JetBrains Mono',monospace;font-size:0.45rem;padding:1px 7px;
  border:1.5px solid var(--color-border-tertiary,#ddd);background:var(--white);
  color:var(--color-text-secondary,#888);cursor:pointer;text-transform:uppercase;
  letter-spacing:0.06em;margin-left:auto;transition:all 0.12s;border-radius:2px;
}
.self-test-btn:hover,.self-test-btn.on{border-color:var(--ac,#333);background:var(--ac,#333);color:#fff;}
.chips{display:flex;flex-wrap:wrap;gap:4px;}
.chip{
  font-family:'JetBrains Mono',monospace;font-size:0.57rem;padding:3px 8px;
  border:1.5px solid var(--color-border-tertiary,#ddd);
  background:var(--color-background-primary,#fff);cursor:pointer;transition:all 0.12s;
}
.chip:hover,.chip.on{border-color:var(--ac,#333);background:var(--ac-bg,#f5f5f5);color:var(--ac,#333);}

/* NEW: misconception chips */
.chip.trap{border-color:var(--danger-border);color:var(--danger,#c0392b);}
.chip.trap:hover,.chip.trap.on{border-color:var(--danger,#c0392b);background:var(--danger-light);color:var(--danger,#c0392b);}
.misconception-label{
  font-family:'JetBrains Mono',monospace;font-size:0.51rem;letter-spacing:0.13em;
  text-transform:uppercase;color:var(--danger,#c0392b);
  margin:0.55rem 0 0.3rem;opacity:0.75;
}

.chip-info{
  margin-top:0.45rem;min-height:2.2rem;font-size:0.68rem;
  color:var(--color-text-secondary,#555);line-height:1.5;
  border-left:3px solid var(--color-border-secondary,#ddd);padding-left:0.55rem;
  transition:border-color 0.15s;
}
.chip-info.lit{border-color:var(--ac,#333);}
.chip-info.trap-lit{border-color:var(--danger,#c0392b) !important;}

/* NEW: chip info connect link */
.chip-connect{
  display:inline-block;margin-top:5px;
  font-family:'JetBrains Mono',monospace;font-size:0.52rem;
  color:var(--ac,#333);cursor:pointer;border-bottom:1px dashed currentColor;
  opacity:0.7;transition:opacity 0.12s;
}
.chip-connect:hover{opacity:1;}

/* NEW: self-test hidden state */
.chip-info.hidden-test{
  background:repeating-linear-gradient(45deg,#f5f5f0,#f5f5f0 4px,#ededea 4px,#ededea 8px);
  color:transparent;user-select:none;cursor:pointer;border-color:var(--color-border-secondary,#ddd) !important;
  position:relative;
}
.chip-info.hidden-test::after{
  content:'click to reveal';
  position:absolute;left:0.55rem;top:50%;transform:translateY(-50%);
  font-family:'JetBrains Mono',monospace;font-size:0.5rem;
  color:var(--color-text-secondary,#aaa);text-transform:uppercase;letter-spacing:0.08em;
}

.sowhat{border:2px solid var(--black);display:grid;grid-template-columns:5px 1fr;margin-top:0.9rem;overflow:hidden;}
.sw-bar{background:var(--ac,#333);transition:background 0.3s;}
.sw-body{padding:0.55rem 0.7rem;font-size:0.7rem;color:var(--color-text-primary,#222);line-height:1.55;}
.sw-body strong{font-family:'Archivo Black',sans-serif;color:var(--ac,#333);transition:color 0.3s;}
.trace-bar{border-top:2px solid var(--black);background:var(--color-background-secondary,#f5f5f0);padding:0.55rem 1.2rem;flex-shrink:0;}
.trace-label{font-family:'JetBrains Mono',monospace;font-size:0.48rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--color-text-secondary,#aaa);margin-bottom:0.35rem;}
.trace-rows{display:flex;flex-direction:column;gap:2px;}
.trace-row{display:flex;align-items:center;gap:6px;opacity:0.3;transition:opacity 0.3s;}
.trace-row.lit{opacity:1;}
.trace-dot{width:6px;height:6px;border-radius:50%;background:var(--color-border-secondary,#ccc);flex-shrink:0;transition:background 0.3s;}
.trace-row.lit .trace-dot{background:var(--ac,#333);}
.trace-txt{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:var(--color-text-secondary,#666);}
.trace-tag{font-family:'JetBrains Mono',monospace;font-size:0.47rem;padding:1px 5px;background:var(--color-background-tertiary,#eee);color:var(--color-text-secondary,#aaa);margin-left:auto;}
.trace-row.lit .trace-tag{background:var(--ac-bg,#eee);color:var(--ac,#555);}

/* VARIANT COMPARE PANEL */
.variant-panel{display:none;flex-direction:column;height:100%;}
.variant-panel.visible{display:flex;}
.vp-header{padding:0.8rem 1.2rem 0.65rem;border-bottom:2px solid var(--black);background:var(--gold);flex-shrink:0;}
.vp-header-title{font-family:'Archivo Black',sans-serif;font-size:0.95rem;color:#fff;}
.vp-header-sub{font-family:'JetBrains Mono',monospace;font-size:0.46rem;color:rgba(255,255,255,0.75);margin-top:2px;letter-spacing:0.08em;}
.vp-tabs{display:flex;border-bottom:2px solid var(--black);flex-shrink:0;overflow-x:auto;}
.vp-tab{
  flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:0.5rem;
  padding:0.45rem 0.2rem 0.4rem;text-align:center;cursor:pointer;
  border-right:1px solid var(--color-border-secondary,#ddd);
  text-transform:uppercase;letter-spacing:0.04em;
  transition:background 0.12s;color:var(--color-text-secondary,#777);
  white-space:nowrap;
}
.vp-tab:last-child{border-right:none;}
.vp-tab.on{background:var(--black);color:#fff;}
.vp-tab-dot{display:block;width:7px;height:7px;border-radius:50%;margin:0 auto 3px;}
.vp-body{flex:1;overflow-y:auto;padding:0.7rem 0.9rem;}
.vp-layer-row{display:grid;grid-template-columns:68px 1fr;margin-bottom:3px;border:1px solid var(--color-border-secondary,#e0e0e0);border-radius:2px;overflow:hidden;}
.vp-layer-label{padding:0.45rem 0.5rem;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--color-border-secondary,#e0e0e0);}
.vp-layer-name{font-family:'Archivo Black',sans-serif;font-size:0.56rem;color:#fff;line-height:1.1;}
.vp-layer-num{font-family:'JetBrains Mono',monospace;font-size:0.38rem;color:rgba(255,255,255,0.5);margin-top:1px;}
.vp-layer-val{padding:0.4rem 0.6rem;display:flex;flex-direction:column;justify-content:center;background:var(--color-background-primary,#fff);}
.vp-val-main{font-family:'JetBrains Mono',monospace;font-size:0.58rem;font-weight:700;color:var(--color-text-primary,#222);}
.vp-val-note{font-family:'Archivo',sans-serif;font-size:0.57rem;color:var(--color-text-secondary,#666);margin-top:2px;line-height:1.35;}
.vp-note{margin-top:0.65rem;padding:0.5rem 0.65rem;border-left:3px solid var(--gold);background:var(--gold-light);font-size:0.64rem;line-height:1.55;color:var(--color-text-primary,#333);}
.vp-note strong{font-family:'Archivo Black',sans-serif;color:var(--gold);}
</style>

<div class="wrap">
  <!-- LEFT -->
  <div class="strata-col">
    <div class="strata-label" id="strata-subtitle">Cross-section — click any stratum</div>
    <div class="perspective-wrap">
      <div class="left-gutter" id="left-gutter">
        <div class="gutter-crown" id="gutter-crown">♔</div>
        <div class="gutter-line-top" id="gutter-line-top"></div>
        <div class="gutter-distro-bar" id="gutter-distro-bar">
          <span class="gutter-distro-label" id="gutter-bar-label">variant</span>
        </div>
        <div class="gutter-line-bot"></div>
      </div>
      <div class="stack-3d" id="stack"></div>
    </div>
    <div class="stack-footer">
      <div class="strata-nav">
        <button class="nav-btn" id="btn-prev" onclick="step(-1)">← Prev</button>
        <div class="nav-dots" id="nav-dots"></div>
        <button class="nav-btn" id="btn-next" onclick="step(1)">Next →</button>
        <span class="nav-ctr" id="nav-ctr"></span>
      </div>
      <div class="variant-key-row">
        <div class="variant-key-bar"></div>
        <div class="variant-key-text">
          <strong id="variant-key-heading">Variant</strong>
          <span id="variant-key-body">bundles layers L1–L5 · foundation not included</span>
        </div>
        <button class="variant-toggle-btn" id="variant-toggle-btn" onclick="toggleVariantPanel()">Compare variants →</button>
      </div>

function buildStack() {
  const s = document.getElementById('stack');
  s.innerHTML = '';
  LAYERS.forEach((l, i) => {
    if (i > 0) { const g = document.createElement('div'); g.className = 'depth-gap'; s.appendChild(g); }
    const el = document.createElement('div');
    el.className = 'stratum' + (i > 0 ? ' variant-layer' : '');
    el.id = 'st-' + l.key;
    el.onclick = () => goTo(i);

    // difficulty dots
    const diff = l.difficulty || 0;
    const diffDots = Array.from({length:5}, (_,di) =>
      `<span class="st-diff-dot${di < diff ? ' on' : ''}"></span>`).join('');

    el.innerHTML = `<div class="stratum-face" style="background:${l.lc}">
      <span class="st-num">L${i}</span>
      <div class="st-text">
        <div class="st-name">${l.label}</div>
        <div class="st-examples">${l.examples.map(e => `<span class="st-ex-tag">${e}</span>`).join('')}</div>
      </div>
      <span class="st-badge" style="background:${l.badgeBg};color:${l.badgeFg}">${l.badge}</span>
      <div class="st-difficulty">
        <div class="st-diff-dots">${diffDots}</div>
        <div class="st-diff-label">${DIFF_LABELS[diff]||''}</div>
      </div>
      <div class="st-rank">
        <div class="st-rank-icon">${l.rank.icon}</div>
        <div class="st-rank-label">${l.rank.label}</div>
      </div>
    </div>
    <div class="stratum-edge" style="background:color-mix(in srgb,${l.lc} 80%,#000)"></div>`;
    s.appendChild(el);
  });

  const dots = document.getElementById('nav-dots');
  dots.innerHTML = '';
  LAYERS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'nav-dot';
    d.onclick = () => goTo(i);
    dots.appendChild(d);
  });

  const tr = document.getElementById('trace-rows');
  tr.innerHTML = '';
  TRACES.forEach((t, i) => {
    const r = document.createElement('div');
    r.className = 'trace-row';
    r.id = 'tr-' + i;
    r.innerHTML = `<div class="trace-dot"></div><span class="trace-txt">${t.txt}</span><span class="trace-tag">${t.tag}</span>`;
    tr.appendChild(r);
  });

  requestAnimationFrame(() => {
    const firstKey = LAYERS[1] ? LAYERS[1].key : LAYERS[0].key;
    const first  = document.getElementById('st-' + firstKey);
    const last   = document.getElementById('st-' + LAYERS[LAYERS.length - 1].key);
    const gutter = document.getElementById('left-gutter');
    const lineTop = document.getElementById('gutter-line-top');
    const bar    = document.getElementById('gutter-distro-bar');
    if (!first || !last || !gutter) return;
    const gr = gutter.getBoundingClientRect();
    const fr = first.getBoundingClientRect();
    const lr = last.getBoundingClientRect();
    lineTop.style.height = Math.max(0, fr.top - gr.top - 4) + 'px';
    bar.style.height = (lr.bottom - fr.top) + 'px';
    document.getElementById('gutter-crown').textContent = LAYERS[0].rank.icon;
  });
}

    t.onclick = () => selectVariant(i);
    tabs.appendChild(t);
  });
}

function selectVariant(idx) {
  curVariant = idx;
  document.querySelectorAll('.vp-tab').forEach((t, i) => t.classList.toggle('on', i === idx));
  renderVariant(idx);
}

function toggleVariantPanel() {
  variantMode = !variantMode;
  document.getElementById('layer-panel').style.display = variantMode ? 'none' : 'flex';
  document.getElementById('variant-panel').classList.toggle('visible', variantMode);
  const btn = document.getElementById('variant-toggle-btn');
  btn.classList.toggle('on', variantMode);
  btn.textContent = variantMode ? '← Back' : CONCEPT_META.variantBtnLabel;
  if (variantMode) { buildVariantTabs(); renderVariant(curVariant); }
}

function toggleSelfTest() {
  selfTestMode = !selfTestMode;
  const btn = document.getElementById('self-test-btn');
  btn.classList.toggle('on', selfTestMode);
  btn.textContent = selfTestMode ? 'Reveal all' : 'Self-test';
  // re-render the chip info area based on current state
  const ci = document.getElementById('chip-info');
  if (!selfTestMode) {
    ci.classList.remove('hidden-test');
    ci.textContent = 'pick a component above ↑';
    ci.classList.remove('lit','trap-lit');
  } else {
    ci.textContent = 'pick a component above ↑';
    ci.classList.remove('lit','trap-lit');
  }
}

// highlight prereq strata
function highlightPrereqs(prereqs, on) {
  LAYERS.forEach(l => {
    const el = document.getElementById('st-' + l.key);
    if (el) el.classList.remove('prereq-lit');
  });
  if (on && prereqs && prereqs.length) {
    prereqs.forEach(key => {
      const el = document.getElementById('st-' + key);
      if (el) el.classList.add('prereq-lit');
    });
  }
}

function renderDetail(l) {
  document.getElementById('d-header').style.background = l.lc;
  document.getElementById('d-eyebrow').textContent = l.eyebrow;
  document.getElementById('d-title').textContent = l.title;
  document.documentElement.style.setProperty('--ac',    l.ac);
  document.documentElement.style.setProperty('--ac-bg', l.acBg);

  // NEW: difficulty dots in header
  const diff = l.difficulty || 0;
  const diffRow = document.getElementById('d-diff-row');
  if (diff > 0) {
    const dots = Array.from({length:5}, (_,i) =>
      `<div class="d-diff-dot${i < diff ? ' on' : ''}"></div>`).join('');
    diffRow.innerHTML = dots + `<span class="d-diff-label" style="margin-left:5px">${DIFF_LABELS[diff]}</span>`;
    diffRow.style.display = 'flex';
  } else {
    diffRow.innerHTML = '';
  }

  // NEW: prereq tags in header
  const prereqRow = document.getElementById('d-prereq-row');
  if (l.prereqs && l.prereqs.length) {
    const prereqLayer = LAYERS.find(x => x.key === l.prereqs[0]);
    prereqRow.innerHTML =
      `<span class="d-prereq-label">needs:</span>` +
      l.prereqs.map(k => {
        const pl = LAYERS.find(x => x.key === k);
        return `<span class="d-prereq-tag" onmouseenter="highlightPrereqs(${JSON.stringify(l.prereqs)},true)" onmouseleave="highlightPrereqs([],false)">${pl ? pl.label : k}</span>`;
      }).join('');
  } else {
    prereqRow.innerHTML = '';
  }

  // NEW: mech why strip
  const whyEl = document.getElementById('mech-why');
  if (l.mech.why) {
    whyEl.innerHTML = `<strong>Why this layer exists</strong>${l.mech.why}`;
    whyEl.style.borderLeftColor = l.ac;
    whyEl.style.display = '';
  } else {
    whyEl.style.display = 'none';
  }

  // mech block
  document.getElementById('mech-block').innerHTML =
    `<div class="mech-block">
      <div class="mech-title">${l.mech.title}</div>
      <div class="mech-rows">
        ${l.mech.rows.map(r =>
          `<div class="mech-row">
            <div class="mech-box" style="color:${l.ac};${r.filled ? 'background:' + l.acBg : ''}">${r.box}</div>
            ${r.arrow ? `<span class="mech-arrow">${r.arrow}</span>` : ''}
            <span class="mech-caption">${r.cap}</span>
          </div>`
        ).join('')}
      </div>
    </div>`;

  // chips
  const chipEl = document.getElementById('chips');
  chipEl.innerHTML = l.chips.map(c =>
    `<span class="chip" data-i="${c.i.replace(/"/g,'&quot;')}" data-connects='${JSON.stringify(c.connects||null)}'>${c.n}</span>`
  ).join('');

  // NEW: misconception chips
  const mcEl = document.getElementById('misconception-chips');
  const mcLabel = document.getElementById('misconception-label');
  if (l.misconceptions && l.misconceptions.length) {
    mcEl.innerHTML = l.misconceptions.map(c =>
      `<span class="chip trap" data-i="${c.i.replace(/"/g,'&quot;')}" data-trap="1">${c.n}</span>`
    ).join('');
    mcLabel.style.display = '';
  } else {
    mcEl.innerHTML = '';
    mcLabel.style.display = 'none';
  }

  const ci = document.getElementById('chip-info');
  ci.textContent = 'pick a component above ↑';
  ci.classList.remove('lit','trap-lit','hidden-test');

  // chip click handler (components + misconceptions)
  [...chipEl.querySelectorAll('.chip'), ...mcEl.querySelectorAll('.chip')].forEach(el => {
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      [...chipEl.querySelectorAll('.chip'), ...mcEl.querySelectorAll('.chip')].forEach(x => x.classList.remove('on'));
      el.classList.add('on');
      const isTrap = el.dataset.trap === '1';
      const connects = el.dataset.connects ? JSON.parse(el.dataset.connects) : null;

      if (selfTestMode) {
        // show question, hide answer
        ci.classList.remove('lit','trap-lit');
        ci.classList.add('hidden-test');
        ci._revealContent = el.dataset.i;
        ci._revealTrap = isTrap;
        ci._revealConnects = connects;
        ci.onclick = () => {
          ci.classList.remove('hidden-test');
          ci.classList.add(isTrap ? 'trap-lit' : 'lit');
          ci.innerHTML = renderChipInfo(el.textContent, el.dataset.i, isTrap, connects, l.ac);
          ci.onclick = null;
        };
      } else {
        ci.classList.remove('hidden-test');
        ci.classList.add(isTrap ? 'trap-lit' : 'lit');
        ci.innerHTML = renderChipInfo(el.textContent, el.dataset.i, isTrap, connects, l.ac);
        ci.onclick = null;
      }
    });
  });

  document.getElementById('sw-bar').style.background = l.ac;
  document.getElementById('sw-body').innerHTML = l.sowhat;
  TRACES.forEach((_, i) => document.getElementById('tr-' + i).classList.toggle('lit', l.trace.includes(i)));
}

function renderChipInfo(name, info, isTrap, connects, ac) {
  let html = `<strong>${name}</strong> — ${info}`;
  if (connects) {
    const targetLayer = LAYERS.find(x => x.key === connects.layer);
    if (targetLayer) {
      const targetIdx = LAYERS.indexOf(targetLayer);
      html += `<br><span class="chip-connect" onclick="goTo(${targetIdx})">→ see <em>${connects.chip}</em> in ${targetLayer.label}</span>`;
    }
  }
  return html;
}

function fireSignal(idx) {
  const el = document.getElementById('st-' + LAYERS[idx].key);
  const face = el.querySelector('.stratum-face');
  const ex = face.querySelector('.pulse-line');
  if (ex) ex.remove();
  const pl = document.createElement('div');
  pl.className = 'pulse-line';
  face.appendChild(pl);
  setTimeout(() => pl.remove(), 700);
}

function goTo(idx, animate = true) {
  cur = Math.max(0, Math.min(LAYERS.length - 1, idx));
  const l = LAYERS[cur];
  document.querySelectorAll('.stratum').forEach((el, i) => el.classList.toggle('active', i === cur));
  document.querySelectorAll('.nav-dot').forEach((d, i) => d.classList.toggle('on', i === cur));
  document.getElementById('btn-prev').disabled = cur === 0;
  const nb = document.getElementById('btn-next');
  nb.textContent = cur === LAYERS.length - 1 ? 'Done ✓' : 'Next →';
  document.getElementById('nav-ctr').textContent = `${cur + 1} / ${LAYERS.length}`;
  fireSignal(cur);
  highlightPrereqs([], false);
  const stBtn = document.getElementById('self-test-btn');
  stBtn.classList.remove('on');
  stBtn.textContent = 'Self-test';
  selfTestMode = false;
  const dbi = document.getElementById('dbi');
  if (animate) {
    dbi.classList.remove('in');
    dbi.classList.add('out');
    setTimeout(() => { renderDetail(l); dbi.classList.remove('out'); dbi.classList.add('in'); }, 160);
  } else {
    renderDetail(l);
  }
}

function step(d) { goTo(cur + d); }

applyMeta();
buildStack();
goTo(1, false);
</script>
